<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#181321">
  <title>Зимний вечер</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #181321; }
    main, canvas, button { position: absolute; inset: 0; width: 100%; height: 100%; }
    canvas { display: block; object-fit: cover; image-rendering: pixelated; }
    button { padding: 0; border: 0; background: transparent; cursor: pointer; }
    button:focus-visible { outline: 2px solid #ffe2a2; outline-offset: -6px; }
    [data-fullscreen] button { cursor: none; }
    #status {
      position: absolute;
      inset: auto 1rem 1rem;
      margin: 0 auto;
      width: fit-content;
      padding: .55rem .8rem;
      background: #181321;
      color: #ffe2a2;
      font: .9rem system-ui, sans-serif;
      pointer-events: none;
    }
    #status:empty { padding: 0; }
  </style>
</head>
<body>
  <main>
    <canvas id="room" role="img" aria-label="Пиксельная новогодняя комната с ёлкой и камином. За окном идёт снег."></canvas>
    <button id="fullscreen" type="button" aria-label="Включить полноэкранный режим"></button>
    <p id="status" role="status"></p>
  </main>
  <script src="room.js" defer></script>
</body>
</html>
