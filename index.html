<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#181321">
  <title>Зимний вечер</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #181321; }
    main, #room, #fullscreen { position: absolute; inset: 0; width: 100%; height: 100%; }
    #room { display: block; object-fit: cover; image-rendering: pixelated; }
    .clock-widget {
      position: absolute;
      top: 9%;
      left: 5%;
      color: #fff0d6;
      font-family: system-ui, sans-serif;
      text-shadow: 0 2px 3px #150f1b, 0 0 10px #150f1b;
      pointer-events: none;
    }
    .clock-widget time { display: block; }
    #clock {
      font-size: 6.25vw;
      font-size: clamp(28px, min(6.25vw, 11vh), 252px);
      font-weight: 650;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    #calendar-date {
      margin-top: .2em;
      color: #f5d7b4;
      font-size: 1.85vw;
      font-size: clamp(14px, min(1.85vw, 3.3vh), 76px);
    }
    #weather {
      position: absolute;
      top: 9%;
      right: 5%;
      z-index: 1;
      color: #fff0d6;
      text-align: right;
      font: 500 clamp(12px, 1.5vw, 2.7vh)/1.25 system-ui, sans-serif;
      text-shadow: 0 2px 3px #150f1b, 0 0 10px #150f1b;
      pointer-events: none;
    }
    .weather-reading { display: flex; align-items: center; justify-content: flex-end; gap: .6em; }
    #weather-icon {
      width: clamp(38px, 6.5vw, 11.5vh);
      height: auto;
      image-rendering: pixelated;
    }
    #weather-temperature {
      font-size: clamp(24px, 4.6vw, 8.1vh);
      line-height: 1;
      font-weight: 650;
      white-space: nowrap;
    }
    #weather-condition { color: #f5d7b4; }
    button { padding: 0; border: 0; background: transparent; cursor: pointer; }
    #fullscreen:focus { outline: none; }
    [data-fullscreen] button { cursor: none; }
    #status {
      position: absolute;
      inset: auto 1rem 1rem;
      margin: 0 auto;
      width: fit-content;
      padding: .55rem .8rem;
      background: #181321;
      color: #ffe2a2;
      font: .9rem system-ui, sans-serif;
      pointer-events: none;
    }
    #status:empty { padding: 0; }
  </style>
</head>
<body>
  <main>
    <canvas id="room" role="img" aria-label="Пиксельная новогодняя комната с ёлкой и камином. За окном идёт снег."></canvas>
    <div class="clock-widget" role="group" aria-label="Время и дата">
      <time id="clock"></time>
      <time id="calendar-date"></time>
    </div>
    <button id="fullscreen" type="button" aria-label="Включить полноэкранный режим"></button>
    <aside id="weather" aria-label="Погода в Санкт-Петербурге" hidden>
      <div>Санкт-Петербург</div>
      <div class="weather-reading">
        <canvas id="weather-icon" width="32" height="28" aria-hidden="true"></canvas>
        <strong id="weather-temperature"></strong>
      </div>
      <div id="weather-condition"></div>
    </aside>
    <p id="status" role="status"></p>
  </main>
  <script src="room.js" defer></script>
  <script src="weather.js?v=pages-weather-3" defer></script>
</body>
</html>
